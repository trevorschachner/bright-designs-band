<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Median show length, small-band shows against the rest" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">Small-band shows are shorter</text><text x="28" y="58" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Median show length in our catalog</text><text x="28" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">11 shows written for small bands</text><rect x="250" y="88" width="531.0" height="44" rx="8" fill="#2563eb"/><text x="769.0" y="116" font-size="17" fill="#fff" text-anchor="end" font-weight="600">6:45</text><text x="28" y="180" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">The other 40 shows</text><rect x="250" y="152" width="590.0" height="44" rx="8" fill="#93c5fd"/><text x="828.0" y="180" font-size="17" fill="#0f172a" text-anchor="end" font-weight="600">7:30</text><line x1="781.0" y1="80" x2="781.0" y2="206" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/><text x="28" y="244" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Most of the 45 seconds comes out of the closer: a median of 1:30 in small-band shows,</text><text x="28" y="266" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">against about 2:00 across four-part shows in general.</text></svg>
