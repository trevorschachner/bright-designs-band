<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="A wind score reduced to high, middle and low lines" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">Score in three lines</text><text x="28" y="58" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Every player is on a part that someone else is also playing</text><rect x="28" y="82" width="824" height="46" rx="8" fill="#2563eb" stroke="#93c5fd"/><text x="46" y="111" font-size="15" fill="#fff" text-anchor="start" font-weight="600">High</text><text x="170" y="111" font-size="13" fill="#fff" text-anchor="start" font-weight="400">Flutes, clarinets, trumpets</text><rect x="28" y="140" width="824" height="46" rx="8" fill="#93c5fd" stroke="#93c5fd"/><text x="46" y="169" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Middle</text><text x="170" y="169" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Alto and tenor saxes, mellophones</text><rect x="28" y="198" width="824" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="46" y="227" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Low</text><text x="170" y="227" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Trombones, baritones, bari sax, tuba</text><rect x="28" y="264" width="824" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/><text x="46" y="293" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Underneath</text><text x="170" y="293" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Front ensemble and synth hold the long chords and the bass</text><text x="28" y="338" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Example split for 16 winds: six high, five middle, five low.</text></svg>
