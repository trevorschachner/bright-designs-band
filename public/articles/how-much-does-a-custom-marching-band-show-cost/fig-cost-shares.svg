<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-label="Typical shares of a full custom design budget" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">How a full custom package typically divides</text><text x="28" y="58" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Shares of the total, not prices</text><rect x="28" y="84" width="271.6666666666667" height="80" rx="8" fill="#2563eb" stroke="#93c5fd"/><text x="40" y="116" font-size="12.5" fill="#fff" text-anchor="start" font-weight="600">Wind book</text><text x="40" y="144" font-size="15" fill="#fff" text-anchor="start" font-weight="600">about 33%</text><rect x="302.6666666666667" y="84" width="216.73333333333332" height="80" rx="8" fill="#1d4ed8" stroke="#93c5fd"/><text x="314.6666666666667" y="116" font-size="12.5" fill="#fff" text-anchor="start" font-weight="600">Drill</text><text x="314.6666666666667" y="144" font-size="15" fill="#fff" text-anchor="start" font-weight="600">about 27%</text><rect x="522.4" y="84" width="134.33333333333334" height="80" rx="8" fill="#93c5fd" stroke="#93c5fd"/><text x="534.4" y="116" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">Percussion</text><text x="534.4" y="144" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">about 17%</text><rect x="659.7333333333333" y="84" width="106.86666666666666" height="80" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="671.7333333333333" y="116" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">Licensing</text><text x="671.7333333333333" y="144" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">about 13%</text><rect x="769.6" y="84" width="79.4" height="80" rx="8" fill="#f1f5f9" stroke="#93c5fd"/><text x="781.6" y="116" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">Sound</text><text x="781.6" y="144" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">about 10%</text><text x="28" y="200" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Licensing is paid by the school to the publisher or agent, outside the design fee.</text><text x="28" y="224" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Coordination is usually bundled with drill. A band with its own percussion or drill writer drops that line.</text><text x="28" y="248" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Based on the ranges we have quoted for each line and a show with four licensed songs.</text></svg>
