<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-label="The 70/30 rule for rehearsal time" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="290" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">Where a season of rehearsal goes</text><text x="28" y="104" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="600">On purpose</text><rect x="178" y="78" width="468.79999999999995" height="44" rx="8" fill="#2563eb"/><text x="192" y="105" font-size="13" fill="#fff" text-anchor="start" font-weight="600">70%: the one or two hard moments</text><rect x="649.8" y="78" width="202.2" height="44" rx="8" fill="#93c5fd"/><text x="661.8" y="105" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">30%: everything else</text><text x="28" y="184" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="600">By accident</text><rect x="178.0" y="158" width="165.5" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="190.0" y="185" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Opener: hard</text><rect x="346.5" y="158" width="165.5" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="358.5" y="185" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Part 2: hard</text><rect x="515.0" y="158" width="165.5" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="527.0" y="185" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Ballad: hard</text><rect x="683.5" y="158" width="165.5" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="695.5" y="185" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Closer: hard</text><text x="178" y="236" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Hard everywhere means the show takes every rehearsal, and fundamentals get none.</text><text x="178" y="258" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">The rest of a 70/30 show has to go on the field almost the first time.</text></svg>
