<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Median part lengths across 33 four-part shows" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">The shape of a four-part show</text><text x="28" y="58" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Median length of each part, 33 shows</text><rect x="28" y="92" width="161.08658008658008" height="84" rx="8" fill="#2563eb"/><text x="42" y="128" font-size="14" fill="#fff" text-anchor="start" font-weight="600">Part 1</text><text x="42" y="152" font-size="20" fill="#fff" text-anchor="start" font-weight="600">1:32</text><rect x="192.08658008658008" y="92" width="225.2943722943723" height="84" rx="8" fill="#1d4ed8"/><text x="206.08658008658008" y="128" font-size="14" fill="#fff" text-anchor="start" font-weight="600">Part 2</text><text x="206.08658008658008" y="152" font-size="20" fill="#fff" text-anchor="start" font-weight="600">2:08</text><rect x="420.3809523809524" y="92" width="219.94372294372295" height="84" rx="8" fill="#93c5fd"/><text x="434.3809523809524" y="128" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Ballad</text><text x="434.3809523809524" y="152" font-size="20" fill="#0f172a" text-anchor="start" font-weight="600">2:05</text><rect x="643.3246753246754" y="92" width="205.67532467532467" height="84" rx="8" fill="#2563eb"/><text x="657.3246753246754" y="128" font-size="14" fill="#fff" text-anchor="start" font-weight="600">Closer</text><text x="657.3246753246754" y="152" font-size="20" fill="#fff" text-anchor="start" font-weight="600">1:57</text><text x="28" y="214" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">First impact and the move out of it: done by about 1:30</text><line x1="28" y1="190" x2="189.08658008658008" y2="190" stroke="#f59e0b" stroke-width="3"/><text x="28" y="250" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Whole shows in the catalog: shortest 5:00, median 7:30, longest 8:43</text><text x="28" y="272" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Half of them run between 7:00 and 8:00.</text></svg>
