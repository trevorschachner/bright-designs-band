ight="400">Aug</text><line x1="790.0" y1="58" x2="790.0" y2="318" stroke="#e2e8f0"/><text x="820.0" y="76" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">Sep</text><text x="28" y="111" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Recap, pick a designer</text><rect x="190.0" y="96" width="60.0" height="20" rx="5" fill="#93c5fd"/><text x="28" y="141" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Concept and cut tracks</text><rect x="250.0" y="126" width="120.0" height="20" rx="5" fill="#2563eb"/><text x="28" y="171" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Licensing requests</text><rect x="340.0" y="156" width="102.00000000000001" height="20" rx="5" fill="#93c5fd"/><text x="28" y="201" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Wind book</text><rect x="370.0" y="186" width="180.0" height="20" rx="5" fill="#2563eb"/><text x="28" y="231" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Percussion and sound design</text><rect x="430.0" y="216" width="180.0" height="20" rx="5" fill="#93c5fd"/><text x="28" y="261" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Drill, a movement at a time</text><rect x="670.0" y="246" width="131.99999999999994" height="20" rx="5" fill="#2563eb"/><text x="28" y="291" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">Guard and choreography</text><rect x="694.0" y="276" width="107.99999999999994" height="20" rx="5" fill="#93c5fd"/><line x1="550.0" y1="84" x2="550.0" y2="318" stroke="#f59e0b" stroke-width="2"/><text x="544.0" y="338" font-size="12.5" fill="#0f172a" text-anchor="end" font-weight="600">May 1: music due</text><line x1="802.0" y1="84" x2="802.0" y2="318" stroke="#f59e0b" stroke-width="2"/><text x="796.0" y="338" font-size="12.5" fill="#0f172a" text-anchor="end" font-weight="600">Labor Day: drill due</text></svg>
