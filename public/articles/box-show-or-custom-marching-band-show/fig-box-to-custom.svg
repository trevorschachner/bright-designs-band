<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-label="Five ways to buy a show, from box show to full custom" font-family="Poppins, ui-sans-serif, system-ui, sans-serif"><rect width="880" height="310" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="28" y="36" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600">Five ways to buy a show</text><line x1="90" y1="150" x2="790" y2="150" stroke="#93c5fd" stroke-width="4"/><circle cx="90.0" cy="150" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="90.0" y="98" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Box show,</text><text x="90.0" y="118" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">as written</text><text x="90.0" y="188" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Nothing changes</text><circle cx="265.0" cy="150" r="11" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="265.0" y="98" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Re-scored,</text><text x="265.0" y="118" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">one piece swapped</text><text x="265.0" y="188" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Fits your players</text><circle cx="440.0" cy="150" r="11" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="440.0" y="98" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Partial</text><text x="440.0" y="118" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">custom</text><text x="440.0" y="188" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Two parts kept, rest new</text><circle cx="615.0" cy="150" r="11" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="615.0" y="98" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Built from</text><text x="615.0" y="118" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">single charts</text><text x="615.0" y="188" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Parts from several shows</text><circle cx="790.0" cy="150" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="3"/><text x="790.0" y="98" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">Full</text><text x="790.0" y="118" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="600">custom</text><text x="790.0" y="188" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Written from a blank page</text><text x="40" y="244" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">Sooner, cheaper, already tested</text><text x="840" y="244" font-size="12.5" fill="#0f172a" text-anchor="end" font-weight="600">More fit, more time, more of your input</text><line x1="40" y1="258" x2="840" y2="258" stroke="#f59e0b" stroke-width="2"/><text x="28" y="294" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Every option still needs drill for your numbers and a license for each copyrighted piece.</text></svg>
