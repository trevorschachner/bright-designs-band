name: Test Suite

on:
  push:
    branches: [main]
  # No branch filter: a pull request stacked on another feature branch got no
  # checks at all under `branches: [main]`, which is exactly when review needs
  # them. Pushes stay limited to main so work in progress does not run twice.
  pull_request:
  workflow_dispatch:

# Consecutive pushes used to stack full runs on top of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://brightdesigns.band

jobs:
  # One job, one install. Build used to be a second job that ran npm ci again.
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches NODE_VERSION in netlify.toml. Testing a version production
          # does not run buys nothing.
          node-version: '20'
          cache: 'npm'

      # Next's incremental build cache. Exact hit when neither the lockfile nor
      # any source changed; otherwise the newest cache for the same lockfile.
      # Sits before npm ci so hashFiles does not walk node_modules.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      - run: npm run lint

      # next lint does not typecheck, so nothing in CI caught type errors before.
      - run: npm run typecheck

      - run: npm run test

      # Not covered by vitest: this one shells out to a tsx script.
      - run: npm run test:email:validate

      # No DATABASE_URL, on purpose. lib/database connects lazily, so importing
      # it is free, and during `next build` without a database the cached reads
      # in lib/services answer their build fallback (empty lists, no show) for
      # the pages Next prerenders. Anything that does query without one throws
      # a clear "DATABASE_URL is not set" error. This job used to be handed the
      # real production connection string, then a dummy one; it needs neither.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key

  # Deterministic budgets (script and total bytes, SEO, best practices) block.
  # Performance score and LCP only warn here: a shared runner's timings swing by
  # 20+ points between runs. The real LCP check is Lighthouse against the Netlify
  # deploy preview, recorded in docs/perf-baseline.md.
  lighthouse:
    name: Lighthouse budget
    needs: [verify]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      # Same env as the verify build (no DATABASE_URL; see the comment there),
      # set at job level because `npm run start` needs it too. Catalog API calls
      # fail with "DATABASE_URL is not set", as they failed against the old
      # unreachable dummy host, so the pages measure their empty states.
      - run: npm run build

      - run: npm run perf:ci
