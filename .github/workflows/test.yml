name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Consecutive pushes used to stack full runs on top of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://brightdesigns.band

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches NODE_VERSION in netlify.toml. Testing a version production
          # does not run buys nothing.
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      # next lint does not typecheck, so nothing in CI caught type errors before.
      - run: npm run typecheck

      - run: npm run test

      # Not covered by vitest: this one shells out to a tsx script.
      - run: npm run test:email:validate

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # lib/database throws at import time without DATABASE_URL, and Next
      # collects page data for /shows/[slug] and /arrangements/[id] during the
      # build, so the variable has to be set and well-formed. It does not have to
      # reach anything: queries against an unreachable host are caught and the
      # pages fall back, and the build still exits 0. This job used to be handed
      # the real production connection string for no reason.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
