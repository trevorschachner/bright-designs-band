name: Test Suite

on:
  push:
    branches: [main]
  # No branch filter: a pull request stacked on another feature branch got no
  # checks at all under `branches: [main]`, which is exactly when review needs
  # them. Pushes stay limited to main so work in progress does not run twice.
  pull_request:
  workflow_dispatch:

# Consecutive pushes used to stack full runs on top of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://brightdesigns.band

jobs:
  # One job, one install. Build used to be a second job that ran npm ci again.
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches NODE_VERSION in netlify.toml. Testing a version production
          # does not run buys nothing.
          node-version: '20'
          cache: 'npm'

      # Next's incremental build cache. Exact hit when neither the lockfile nor
      # any source changed; otherwise the newest cache for the same lockfile.
      # Sits before npm ci so hashFiles does not walk node_modules.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      - run: npm run lint

      # next lint does not typecheck, so nothing in CI caught type errors before.
      - run: npm run typecheck

      - run: npm run test

      # Not covered by vitest: this one shells out to a tsx script.
      - run: npm run test:email:validate

      # lib/database throws at import time without DATABASE_URL, and Next
      # collects page data for /shows/[slug] and /arrangements/[id] during the
      # build, so the variable has to be set and well-formed. It does not have to
      # reach anything: queries against an unreachable host are caught and the
      # pages fall back, and the build still exits 0. This job used to be handed
      # the real production connection string for no reason.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key

  # Performance budget (lighthouserc.json): performance >= 0.95, LCP <= 2 s,
  # script <= 180 KiB, mobile emulation, on /, /shows and /about.
  # Builds and serves the site on the runner instead of waiting on the Netlify
  # deploy preview, so the result does not depend on Netlify timing. With the
  # dummy env the catalog pages render their empty/fallback state, so these
  # numbers are a lower bound on page weight and an upper bound on speed; the
  # real check is against production after SP2.
  lighthouse:
    name: Lighthouse budget (advisory)
    needs: [verify]
    if: github.event_name == 'pull_request'
    # Advisory until SP2 (#59) lands; then make it required.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      # Same dummy env as the verify build (see the comment there); it is set
      # at job level because `npm run start` needs it too.
      - run: npm run build

      - run: npm run perf:ci
