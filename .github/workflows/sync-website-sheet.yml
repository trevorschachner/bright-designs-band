name: Sync website sheet

# Mirrors the site's shows, parts and pieces into the "Active Assets on
# Website" Google Sheet. One-way, database → sheet. See
# scripts/sync-website-sheet.ts and docs/features/show-data-model.md.

on:
  schedule:
    # 10:00 UTC = 6am Eastern (5am in winter), before anyone opens the sheet.
    - cron: '0 10 * * *'
  # "Run workflow" button on the Actions tab, for a sync right after an upload.
  workflow_dispatch:

concurrency:
  group: sync-website-sheet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run sync:sheet
        env:
          # A read-only Postgres role, not the app's connection string. The
          # script also refuses to read outside a READ ONLY transaction.
          DATABASE_URL: ${{ secrets.SHEET_SYNC_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
